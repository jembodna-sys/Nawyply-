name: Build Nawyply Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app source archive
        run: |
          mkdir app
          unzip Nawyply_Starter_v1.zip -d app
          cd app/Nawyply_Starter_v1
          echo "APP_DIR=$PWD" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web app
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawyply-debug-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
